name: Build Phoenix Load & Stock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]

          title = Phoenix Load & Stock
          package.name = phoenixloadstock
          package.domain = com.phoenix

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,db

          version = 1.0

          requirements = python3,kivy==2.3.1

          orientation = portrait

          fullscreen = 0

          android.permissions = INTERNET

          android.api = 35
          android.minapi = 24
          android.ndk = 27c
          android.archs = arm64-v8a

          android.accept_sdk_license = True

          [buildozer]

          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Load-Stock-APK
          path: bin/*.apk
